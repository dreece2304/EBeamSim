name: EBL Simulation Test Suite

on:
  push:
    branches: [ main, develop, scoring/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  gui-tests:
    name: GUI Tests (headless)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install system Qt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/gui/requirements.txt
        pip install pytest

    - name: Run GUI tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest scripts/gui/tests/ --maxfail=5

  # The Geant4 C++ simulation is not built in CI (a Geant4 install is too heavy
  # for hosted runners). Build and validate it locally per README instructions.
