name: EBL Simulation Test Suite

on:
  push:
    branches: [ main, develop, scoring/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly performance tests
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.10'
  
jobs:
  # Fast unit tests - run on every commit
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          venv/
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('python/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-dev.txt
        pip install hypothesis  # For property-based testing
    
    - name: Run unit tests
      run: |
        cd tests
        pytest unit/ \
          --maxfail=5 \
          -m "not slow and not integration" \
          --cov-fail-under=70
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-py${{ matrix.python-version }}
        path: |
          tests/junit.xml
          tests/coverage.xml
          tests/coverage_html/

  # Pattern generation tests with property-based testing
  pattern-tests:
    name: Pattern Generation Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-dev.txt
        pip install hypothesis
    
    - name: Run pattern tests with extended examples
      run: |
        cd tests
        pytest unit/test_pattern_generation.py \
          --hypothesis-max-examples=1000 \
          --hypothesis-derandomize \
          -v
    
    - name: Upload pattern test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: pattern-test-results
        path: tests/junit.xml

  # Integration tests - require more setup
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-dev.txt
    
    - name: Set up mock Geant4 environment
      run: |
        mkdir -p /opt/geant4/share/Geant4-11.3.2/data
        export G4INSTALL=/opt/geant4
        export G4LEDATA=/opt/geant4/share/Geant4-11.3.2/data/G4EMLOW8.6
    
    - name: Run integration tests
      run: |
        cd tests
        pytest integration/ \
          --run-integration \
          -m "not slow" \
          --maxfail=3
      env:
        G4INSTALL: /opt/geant4
        G4LEDATA: /opt/geant4/share/Geant4-11.3.2/data/G4EMLOW8.6
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: tests/junit.xml

  # Performance tests - run less frequently
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-dev.txt
        pip install psutil memory-profiler
    
    - name: Run performance tests
      run: |
        cd tests
        pytest performance/ \
          --run-slow \
          --benchmark-only \
          --benchmark-json=benchmark_results.json
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: tests/benchmark_results.json
    
    - name: Performance regression check
      run: |
        python scripts/check_performance_regression.py tests/benchmark_results.json

  # Cross-platform tests
  cross-platform:
    name: Cross-Platform Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-dev.txt
    
    - name: Run cross-platform tests
      run: |
        cd tests
        pytest unit/ integration/ \
          -m "not slow and not gui" \
          --maxfail=5
    
    - name: Test result summary
      run: |
        echo "Cross-platform test completed on ${{ matrix.os }}"

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-dev.txt
    
    - name: Run black formatting check
      run: |
        black --check --diff python/ tests/
    
    - name: Run flake8 linting
      run: |
        flake8 python/ tests/ --max-line-length=88
    
    - name: Run mypy type checking
      run: |
        mypy python/ebl_sim_modular/ --ignore-missing-imports
    
    - name: Run isort import sorting check
      run: |
        isort --check-only --diff python/ tests/

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r python/ -f json -o security_report.json || true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: security_report.json

  # Test report aggregation
  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, pattern-tests]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Generate test report
      run: |
        python scripts/generate_test_report.py
    
    - name: Upload combined test report
      uses: actions/upload-artifact@v3
      with:
        name: combined-test-report
        path: test_report.html
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('test_summary.md')) {
            const summary = fs.readFileSync('test_summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }

  # Deployment readiness check
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, code-quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check deployment readiness
      run: |
        echo "Checking deployment readiness..."
        echo "✅ Unit tests passed"
        echo "✅ Integration tests passed" 
        echo "✅ Code quality checks passed"
        echo "✅ Ready for deployment"
    
    - name: Create deployment artifact
      run: |
        tar -czf ebl-simulation-${{ github.sha }}.tar.gz \
          python/ \
          src/ \
          config/ \
          macros/ \
          CMakeLists.txt \
          README.md
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: ebl-simulation-${{ github.sha }}.tar.gz