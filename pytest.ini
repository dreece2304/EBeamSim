[pytest]
# EBL Simulation Test Configuration
# The only Python tests live in scripts/gui/tests (run headless with
# QT_QPA_PLATFORM=offscreen). C++ has no unit tests currently.

testpaths = scripts/gui/tests
python_files = test_*.py
addopts = -q --tb=short

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gui: marks tests as GUI tests
