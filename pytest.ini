[pytest]
# EBL Simulation Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    gui: marks tests as GUI tests  
    geant4: marks tests that require Geant4
    pattern: marks pattern-related tests
    config: marks configuration tests
    performance: marks performance/benchmark tests
    physics: marks physics simulation tests
    mock_geant4: marks tests that use Geant4 mocks

# Test output
addopts = 
    --verbose
    --tb=short
    --cov=python/ebl_sim_modular
    --cov-report=html:tests/coverage_html
    --cov-report=term-missing
    --cov-report=xml:tests/coverage.xml
    --junit-xml=tests/junit.xml
    --strict-markers
    --strict-config

# Coverage settings
[coverage:run]
source = python/ebl_sim_modular
omit = 
    */tests/*
    */venv/*
    */build/*
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Minimum coverage threshold
fail_under = 80

[coverage:html]
directory = tests/coverage_html

[coverage:xml]
output = tests/coverage.xml