<!--[if lt IE 7]><div style=' clear: both; height: 59px; padding:0 0 0 15px; position: relative;'><a href=&quot;http://windows.microsoft.com/en-US/internet-explorer/products/ie/home?ocid=ie6_countdown_bannercode&quot;><img src=&quot;http://storage.ie6countdown.com/assets/100/images/banners/warning_bar_0000_us.jpg&quot; border=&quot;0&quot; height=&quot;42&quot; width=&quot;820&quot; alt=&quot;You are using an outdated browser. For a faster, safer browsing experience, upgrade for free today.&quot; /></a></div><![endif]-->
<p class=p_Normal>This manual is intended as a reference for all users of BEAMER. The reader should have some general background with layout data processing, e-beam proximity effect correction and e-beam modeling. It is also assumed that the user is familiar with a window based graphical user interface (GUI) on modern computer platforms.</p>
<p class=p_Normal>&amp;nbsp;</p>
<p class=p_Normal>The baseline for this document is BEAMER 5.4.2 running on a Microsoft Windows operating system; however this manual applies for BEAMER running on a Linux operating system. BEAMER is available in various package and license configurations. This document will discuss the full functionality available in the BEAMER full advanced package.</p>
<p class=p_Normal>&amp;nbsp;</p>
<p class=p_Normal>Basic Functionality:</p>
<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>VisualFLOW<span style=font-size:8pt;vertical-align:super>TM</span> graphical user interface for drag and drop design of process flows <p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>VIEWER<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Import of layouts in various generic formats<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Export to various generic formats<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Extraction of cells, layers or regions of interest<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Transformation (Scale, Shift, Rotate, Mirror)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Grid Controls (modify the database grid)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Controls for splitting and merging of layouts<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Scripting and Loops for automation<p class=p_Normal>&amp;nbsp;</p>
<p class=p_Normal>Advanced functionality:</p>
<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Layout operations (e.g. healing, overlap removal, tone-reversal, bias, pattern XOR)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Boolean operations (AND, OR, XOR, MINUS)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>E-Beam Proximity Effect Correction<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>E-Beam Feature Dose Assignment by layer or data type<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>E-Beam modeling (simulation of energy density)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Resist modeling (simulation of resist contours)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Metrology (measure a CD at a defined position)<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Export to various E-Beam machines<p style=&quot;text-align:left;text-indent:0px;padding:0px 0px 0px 13px;margin:0px 0px 0px 0px&quot;><span style='font-size:11pt;font-family:&quot;Arial Unicode MS&quot;,&quot;Lucida Sans Unicode&quot;,&quot;Arial&quot;;color:#000000;display:inline-block;width:13px;margin-left:-13px'>•</span>Import of layouts in various E-Beam machine formats<p class=p_Normal>&amp;nbsp;</p>
